

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mvc-app-dev
    ports:
      - "3030:3030"          # host:container
    volumes:
      - ./:/app:cached      # mount project root into /app in container
      # Optionally mount your local NuGet package cache to speed restores (Linux/macOS):
      - ~/.nuget/packages:/root/.nuget/packages:ro
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ASPNETCORE_URLS=http://+:3030
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=growcery;Username=growcery;Password=${POSTGRES_PASSWORD:-growcery_dev_pw}
    command: ["dotnet", "watch", "run", "--no-launch-profile"]
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=growcery
      - POSTGRES_USER=growcery
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-growcery_dev_pw}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growcery -d growcery"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

